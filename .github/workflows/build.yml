name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6==6.8.0 shiboken6==6.8.0 qtpy qrcode pillow

    - name: Download Android Wheels
      run: |
        mkdir -p wheels
        wget -q https://github.com/EchterAlsFake/PySide6-to-Android/releases/download/v6.8.0/PySide6-6.8.0-cp311-cp311-android_aarch64.whl -O wheels/PySide6-android.whl
        wget -q https://github.com/EchterAlsFake/PySide6-to-Android/releases/download/v6.8.0/shiboken6-6.8.0-cp311-cp311-android_aarch64.whl -O wheels/shiboken6-android.whl

    - name: Package Android APK
      run: |
        pyside6-android-deploy \
          --name "AuraQR" \
          --wheel-pyside wheels/PySide6-android.whl \
          --wheel-shiboken wheels/shiboken6-android.whl \
          --ndk-path "$ANDROID_NDK_LATEST_HOME" \
          --sdk-path "$ANDROID_HOME"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraQR-Android-APK
        path: "**.apk"
        
