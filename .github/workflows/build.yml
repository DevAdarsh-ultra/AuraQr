name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download PySide6 Android Wheels
      run: |
        mkdir wheels
        pip download PySide6 shiboken6 \
          --platform android_21_arm64_v8a \
          --only-binary=:all: \
          --no-deps \
          -d wheels

    - name: Package Android APK
      run: |
        PYSIDE_WHEEL=$(ls wheels/PySide6*.whl | head -n 1)
        SHIBOKEN_WHEEL=$(ls wheels/shiboken6*.whl | head -n 1)
        pyside6-android-deploy \
          --name "AuraQR" \
          --wheel-pyside "$PYSIDE_WHEEL" \
          --wheel-shiboken "$SHIBOKEN_WHEEL"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraQR-Android-APK
        path: "**.apk"
        
