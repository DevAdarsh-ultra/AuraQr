name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Host PySide6 Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6==6.8.0 shiboken6==6.8.0 qtpy qrcode pillow

    - name: Clone Qt for Python Setup Tools
      run: |
        git clone https://code.qt.io/pyside/pyside-setup.git --branch 6.8 --depth 1

    - name: Download Android NDK and SDK via Qt Script
      run: |
        cd pyside-setup
        pip install -r requirements.txt
        pip install -r tools/cross_compile_android/requirements.txt
        python tools/cross_compile_android/main.py --download-only --auto-accept-license

    - name: Initialize pysidedeploy.spec
      run: |
        pyside6-android-deploy --init

    - name: Package Android APK
      run: |
        pyside6-android-deploy \
          --name "AuraQR" \
          --ndk-path "$HOME/.pyside6_android_deploy/android-ndk-r26b" \
          --sdk-path "$HOME/.pyside6_android_deploy/android-sdk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraQR-Android-APK
        path: "**.apk"
        
