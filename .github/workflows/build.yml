name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6==6.7.2 shiboken6==6.7.2 qtpy qrcode pillow

    - name: Download Official Qt Android Wheels
      run: |
        mkdir -p wheels
        pip download PySide6==6.7.2 shiboken6==6.7.2 \
          --index-url https://download.qt.io/official_releases/QtForPython/ \
          --platform android_21_arm64_v8a \
          --only-binary=:all: \
          --no-deps \
          -d wheels || true

        # Fallback to direct curl if pip download flags fail on platform resolution
        if [ -z "$(ls -A wheels)" ]; then
          curl -fL "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.7.2-tp1-cp311-cp311-android_aarch64.whl" -o wheels/PySide6-android.whl
          curl -fL "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.7.2-tp1-cp311-cp311-android_aarch64.whl" -o wheels/shiboken6-android.whl
        fi

    - name: Package Android APK
      run: |
        PYSIDE_WHEEL=$(ls wheels/PySide6*.whl | head -n 1)
        SHIBOKEN_WHEEL=$(ls wheels/shiboken6*.whl | head -n 1)
        
        pyside6-android-deploy \
          --name "AuraQR" \
          --wheel-pyside "$PYSIDE_WHEEL" \
          --wheel-shiboken "$SHIBOKEN_WHEEL" \
          --ndk-path "$ANDROID_NDK_LATEST_HOME" \
          --sdk-path "$ANDROID_HOME"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraQR-Android-APK
        path: "**.apk"
        
